{% extends "base.html" %}

{% block content %}
<!-- 🟢 init: Centered login form container -->
<div class="max-w-md mx-auto px-6 py-12">
    <div class="bg-black/60 border border-neonpurple-500/90 rounded-2xl p-9 shadow-lg backdrop-blur-sm">

        <!-- 🔷 Gradient Heading -->
        <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-neonpurple-500 to-pink-400 uppercase font-orbitron tracking-wider mb-8 text-center">
            Login
        </h2>

        <!-- 🔴 Error Block -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-500/10 border border-red-500/40 text-red-400 rounded-lg font-orbitron text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- 🔐 Login Form -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            
            <!-- ✉️ Email Input -->
            <div>
                <label for="email" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-400 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
            </div>

            <!-- 🔒 Password Input -->
            <div>
                <label for="password" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                        class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 pr-12 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-400 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
                    
                    <!-- 👁 Show Password Icon -->
                    <button type="button" onclick="togglePasswordVisibility('password')" 
                        class="absolute inset-y-0 right-3 flex items-center text-neonpurple-400 hover:text-white transition duration-150 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 🟢 Submit Button -->
            <button type="submit"
                class="w-full bg-neonpurple-500/80 hover:bg-neonpurple-500 text-white py-3 rounded-xl font-orbitron tracking-wider transition-all duration-300 shadow-md hover:shadow-lg">
                Login
            </button>
        </form>

        <!-- 📝 Signup Link -->
        <p class="mt-6 text-center text-neonpurple-300 font-orbitron text-sm">
            Don't have an account?
            <a href="{{ url_for('signup') }}" class="text-white hover:text-neonpurple-400 underline">Sign up here</a>
        </p>
    </div>
</div>
<!-- 🟢 init: JS to toggle password visibility -->
<script>
function togglePasswordVisibility(fieldId) {
    const field = document.getElementById(fieldId);
    field.type = field.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
