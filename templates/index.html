{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Welcome Section -->
    <section class="text-center mb-12">
        <div class="bg-black/50 border border-neonpurple-500/30 rounded-xl p-8 shadow-neon-sm backdrop-blur-sm">
            <h2 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-neonpurple-500 to-pink-400 uppercase font-orbitron tracking-wider mb-4">
                HELLO, {{ user.name }}!
            </h2>
            <p class="text-neonpurple-400 font-orbitron text-xl tracking-wider">
                @{{ user.nick }}
            </p>
        </div>
    </section>

    <!-- Top Players Section -->
    <section class="mb-12">
        <div class="bg-black/50 border border-neonpurple-500/30 rounded-xl p-6 shadow-neon-sm backdrop-blur-sm">
            <h3 class="text-2xl font-bold text-white font-orbitron tracking-wider border-b border-neonpurple-500/30 pb-3 mb-6">
                <span class="text-neonpurple-400">TOP</span> PLAYERS
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                {% for player, score in top_players %}
                <div class="bg-black/40 border border-neonpurple-500/20 rounded-lg p-4 hover:shadow-neon-sm transition-all duration-300">
                    <div class="flex items-center space-x-4">
                        <div class="text-neonpurple-500 font-bold text-xl font-orbitron">
                            #{{ loop.index }}
                        </div>
                        <div>
                            <h4 class="text-white font-medium">{{ player }}</h4>
                            <p class="text-neonpurple-300 text-sm">{{ score }} pts</p>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="col-span-3 text-center py-8">
                    <p class="text-gray-400 font-orbitron">No player data yet</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>

    <!-- Quick Actions -->
    <section class="flex flex-wrap justify-center gap-4">
        <a href="{{ url_for('games') }}" 
           class="px-8 py-3 bg-transparent border border-neonpurple-500 text-neonpurple-400 rounded-lg font-orbitron tracking-wider hover:bg-neonpurple-500/10 hover:text-white hover:shadow-neon-sm transition-all duration-300">
            PLAY GAMES
        </a>
        <a href="{{ url_for('profile') }}" 
           class="px-8 py-3 bg-transparent border border-neonpurple-500 text-neonpurple-400 rounded-lg font-orbitron tracking-wider hover:bg-neonpurple-500/10 hover:text-white hover:shadow-neon-sm transition-all duration-300">
            VIEW PROFILE
        </a>
        <a href="{{ url_for('scores') }}" 
           class="px-8 py-3 bg-transparent border border-neonpurple-500 text-neonpurple-400 rounded-lg font-orbitron tracking-wider hover:bg-neonpurple-500/10 hover:text-white hover:shadow-neon-sm transition-all duration-300">
            VIEW ALL SCORES
        </a>
    </section>
</div>
{% endblock %}
