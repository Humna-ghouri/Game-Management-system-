{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-12">
    <div class="bg-black/60 border border-neonpurple-500/90 rounded-2xl p-10 shadow-lg backdrop-blur-sm">

        <!-- ✨ Header -->
        <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-neonpurple-500 to-pink-400 uppercase font-orbitron tracking-wider mb-10 text-center">
            Sign Up
        </h2>

        <!-- 🔴 Error Message -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-500/10 border border-red-500/0 text-red-400 rounded-lg font-orbitron text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- 📝 Sign-Up Form -->
        <form method="POST" action="{{ url_for('signup') }}" class="space-y-6">

            <!-- 👤 Full Name + Nickname -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
                </div>

                <div>
                    <label for="nick" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Nickname</label>
                    <input type="text" id="nick" name="nick" required
                        class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
                </div>
            </div>

            <!-- 📧 Email -->
            <div>
                <label for="email" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
            </div>

            <!-- 🔒 Password + 📅 DOB -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Password -->
                <div class="relative">
                    <label for="password" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 pr-12 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200">
                    <!-- Eye Icon -->
                    <button type="button" onclick="togglePasswordVisibility('password')"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-neonpurple-400 hover:text-white transition duration-150 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <!-- DOB -->
<!-- Age -->
<div class="form-group">
    <label for="age" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">Age</label>
    <input type="number" id="age" name="age" min="1" max="120" required
        class="w-full bg-black/40 border border-neonpurple-500/90 text-white px-4 py-3 rounded-xl placeholder-gray-400 focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition-all duration-200"
        placeholder="Enter your age">
</div>
            </div>

            <!-- 🧬 Gender -->
        <div>
    <label for="gender" class="block text-neonpurple-300 font-orbitron mb-2 text-sm">
        Gender
    </label>
    <select id="gender" name="gender"
        class="w-full bg-black/40 text-white border border-neonpurple-500/90 px-4 py-3 rounded-xl focus:outline-none focus:border-neonpurple-500 focus:ring-1 focus:ring-neonpurple-500 hover:bg-black/50 transition duration-200 appearance-none">
        <option value="" disabled selected class="bg-black text-white">Select</option>
        <option value="male" class="bg-black text-white hover:bg-neonpurple-500">Male</option>
        <option value="female" class="bg-black text-white hover:bg-neonpurple-500">Female</option>
        <option value="other" class="bg-black text-white hover:bg-neonpurple-500">Other</option>
    </select>
</div>


            <!-- 🚀 Submit Button -->
            <button type="submit"
                class="w-full bg-neonpurple-500/80 hover:bg-neonpurple-500 text-white py-3 rounded-xl font-orbitron tracking-wider transition-all duration-300 shadow-md hover:shadow-lg">
                Sign Up
            </button>
        </form>

        <!-- 🔁 Link to Login -->
        <p class="mt-6 text-center text-neonpurple-300 font-orbitron text-sm">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-white hover:text-neonpurple-400 underline">Login here</a>
        </p>
    </div>
</div>

<script>
function togglePasswordVisibility(fieldId) {
    const field = document.getElementById(fieldId);
    field.type = field.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
